<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Italiana&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário do meu amor</title>
</head>
<body>
     <header>

    <img src="titulo.png" alt="Happy Birthday" style="width: 85%; max-width: 340px;">

        <h1 class="titulo">meu amorzinho!</h1>
     </header>
<img src="bandeirinha.png" class="bandeirinha">

  <div class="clock-wrap">
    <div class="clock" id="clock">00:00</div>
    <p class="date-label" id="date-label">carregando...</p>
    <p class="next-unlock" id="next-unlock"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>
 
<!-- Modal centralizado -->
<div class="modal-overlay" id="modal" onclick="closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <p class="modal-hour" id="modal-hour"></p>
    <div class="modal-icon" id="modal-icon"></div>
    <p class="modal-message" id="modal-message"></p>
  </div>
</div>
   <script src="script.js"></script>
</body>
    
</html>
